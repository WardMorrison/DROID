<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(45, 45, 45, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 6px;
            border: 1px solid rgba(255, 193, 7, 0.3);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffc107 20%, #ffc107 80%, transparent);
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 600;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background: #ffc107;
            border-radius: 50%;
            opacity: 0.7;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ffc107 0%, #ffb300 50%, #ff8f00 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 2px 6px rgba(255, 193, 7, 0.4);
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .logo::before {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(60, 60, 60, 0.9);
            border-radius: 50%;
            top: 5px;
            left: 5px;
        }

        .logo::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(60, 60, 60, 0.7);
            border-radius: 50%;
            top: 7px;
            right: 6px;
        }

        .input-container {
            position: relative;
        }

        .input-container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #ffc107 50%, transparent);
            border-radius: 0 4px 4px 0;
            z-index: 1;
        }

        #commandInput {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(120, 120, 120, 0.4);
            border-radius: 4px;
            background: rgba(60, 60, 60, 0.8);
            color: #e0e0e0;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        #commandInput:focus {
            border-color: rgba(255, 193, 7, 0.6);
            background: rgba(70, 70, 70, 0.9);
            box-shadow: 0 0 0 2px rgba(255, 193, 7, 0.1);
        }

        #commandInput::placeholder {
            color: rgba(160, 160, 160, 0.8);
        }

        .response-area {
            max-height: 100px;
            overflow-y: auto;
            background: rgba(35, 35, 35, 0.9);
            border-radius: 4px;
            padding: 12px;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.4;
            display: none;
            border-left: 2px solid rgba(255, 193, 7, 0.4);
        }

        .response-area.show {
            display: block;
        }

        .response-text {
            margin-bottom: 8px;
        }

        .command-output {
            font-family: 'Courier New', monospace;
            background: rgba(20, 20, 20, 0.8);
            padding: 8px;
            border-radius: 3px;
            border-left: 2px solid #ffc107;
            font-size: 12px;
            white-space: pre-wrap;
            color: #d0d0d0;
        }

        .loading {
            color: #ffc107;
            font-style: italic;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #4caf50;
        }

        .shortcuts {
            position: absolute;
            bottom: 8px;
            right: 15px;
            color: rgba(160, 160, 160, 0.7);
            font-size: 11px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(60, 60, 60, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 193, 7, 0.4);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 193, 7, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <span>DROID</span>
        </div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="commandInput" 
                placeholder="Tell me what to do... (e.g., 'install chrome', 'open calculator')"
                autofocus
            >
        </div>
        
        <div id="responseArea" class="response-area">
            <div id="responseText" class="response-text"></div>
            <div id="commandOutput" class="command-output"></div>
        </div>
        
        <div class="shortcuts">
            Ctrl+Space to toggle • Esc to hide
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
