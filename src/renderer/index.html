<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #181A1B; /* dark grey */
            /* backdrop-filter: blur(10px); */
            border-radius: 12px;
            border: 1px solid #3a3a3a;
            overflow: hidden;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #232426;
            border-radius: 10px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #FFD600;
            font-size: 14px;
            font-weight: 600;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-toggle {
            font-size: 11px;
            color: #FFD600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #FFD600;
            background: #232426;
            transition: all 0.2s;
        }

        .ai-toggle:hover {
            background: #FFD600;
            color: #232426;
        }

        .ai-toggle.local {
            color: #FFD600;
            border-color: #FFD600;
        }

        .ai-toggle.cloud {
            color: #FFD600;
            border-color: #FFD600;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #FFD600 0%, #B0A800 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 2px 8px rgba(255, 214, 0, 0.2);
        }

        .logo::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FFD600;
            border-radius: 50%;
            top: 4px;
            left: 4px;
            box-shadow: 0 0 4px #FFD600;
        }

        .logo::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            background: #FFD600;
            border-radius: 50%;
            top: 6px;
            right: 5px;
            opacity: 0.7;
        }

        .input-container {
            position: relative;
        }

        #commandInput {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #FFD600;
            border-radius: 8px;
            background: #232426;
            color: #FFD600;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        #commandInput:focus {
            border-color: #FFD600;
            background: #232426;
        }

        #commandInput::placeholder {
            color: #B0A800;
        }

        .response-area {
            max-height: 100px;
            overflow-y: auto;
            background: #232426;
            border-radius: 8px;
            padding: 12px;
            color: #FFD600;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }

        .response-area.show {
            display: block;
        }

        .response-text {
            margin-bottom: 8px;
        }

        .command-output {
            font-family: 'Courier New', monospace;
            background: #181A1B;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #FFD600;
            font-size: 12px;
            color: #FFD600;
            white-space: pre-wrap;
        }

        .loading {
            color: #FFD600;
            font-style: italic;
        }

        .error {
            color: #FFD600;
        }

        .success {
            color: #FFD600;
        }

        .shortcuts {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #B0A800;
            font-size: 11px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #232426;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #FFD600;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #B0A800;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <div class="logo"></div>
                <span>DROID</span>
            </div>
            <!-- AI toggle removed for fully local mode -->
        </div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="commandInput" 
                placeholder="Tell me what to do... (e.g., 'install chrome', 'open calculator')"
                autofocus
            >
        </div>
        
        <div id="responseArea" class="response-area">
            <div id="responseText" class="response-text"></div>
            <div id="commandOutput" class="command-output"></div>
        </div>
        
        <div class="shortcuts">
            Ctrl+Space to toggle • Esc to hide
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
